<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Defter — Muhasebe Uygulaması</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0e0f11; --surface:#16181c; --surface2:#1e2026; --border:#2a2d35;
  --income:#2dd4a0; --expense:#f4645f; --text:#eef0f5; --muted:#5a6075; --accent:#f0c060;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;padding:2rem 1rem;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.2;pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;max-width:960px;margin:0 auto;}

header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.brand h1{font-family:'DM Serif Display',serif;font-size:2.4rem;letter-spacing:-0.03em;}
.brand h1 span{color:var(--accent);font-style:italic;}
.brand p{font-size:0.65rem;color:var(--muted);letter-spacing:0.14em;text-transform:uppercase;margin-top:0.2rem;}
.tabs{display:flex;gap:0.4rem;}
.tab-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.45rem 1rem;border-radius:8px;cursor:pointer;transition:all 0.15s;}
.tab-btn.active,.tab-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(240,192,96,0.08);}

.page{display:none;}.page.active{display:block;}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem 1.5rem;transition:border-color 0.2s;}
.card:hover{border-color:var(--accent);}
.card label{display:block;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;}
.card .amount{font-family:'DM Serif Display',serif;font-size:1.8rem;letter-spacing:-0.02em;}
.card.income .amount{color:var(--income);}
.card.expense .amount{color:var(--expense);}
.card.balance .amount{color:var(--accent);}
.card .sub{font-size:0.62rem;color:var(--muted);margin-top:0.3rem;}

.ratio-bar{height:8px;border-radius:99px;overflow:hidden;margin-bottom:2rem;background:var(--surface2);border:1px solid var(--border);display:flex;}
.bar-income{background:var(--income);transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);}
.bar-expense{background:var(--expense);transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);}

.form-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:2rem;}
.form-panel h2{font-family:'DM Serif Display',serif;font-size:1.1rem;margin-bottom:1.2rem;}
.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:0.75rem;align-items:end;}
.field{display:flex;flex-direction:column;gap:0.35rem;}
.field label{font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
.field input,.field select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.82rem;padding:0.58rem 0.8rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;width:100%;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,192,96,0.1);}
.field select option{background:var(--surface2);}
.field input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.6);cursor:pointer;}

.btn-primary{background:var(--accent);color:#0e0f11;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:0.8rem;font-weight:500;letter-spacing:0.06em;padding:0.62rem 1.2rem;cursor:pointer;transition:opacity 0.2s,transform 0.1s;white-space:nowrap;}
.btn-primary:hover{opacity:0.85;}.btn-primary:active{transform:scale(0.97);}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-family:'DM Mono',monospace;font-size:0.8rem;padding:0.62rem 1rem;cursor:pointer;transition:all 0.15s;}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;width:min(540px,95vw);animation:modalIn 0.2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(10px);}to{opacity:1;transform:none;}}
.modal h3{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:1.5rem;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;}
.modal-grid .span2{grid-column:span 2;}
.modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.4rem;}

.tx-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:0.75rem;}
.panel-header h2{font-family:'DM Serif Display',serif;font-size:1.05rem;}
.filters{display:flex;gap:0.35rem;flex-wrap:wrap;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.28rem 0.65rem;border-radius:6px;cursor:pointer;transition:all 0.15s;}
.filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(240,192,96,0.07);}
.tx-list{min-height:100px;}
.tx-item{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:0.75rem;align-items:center;padding:0.9rem 1.5rem;border-bottom:1px solid var(--border);animation:slideIn 0.22s ease;transition:background 0.15s;}
.tx-item:last-child{border-bottom:none;}.tx-item:hover{background:var(--surface2);}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.tx-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.tx-dot.income{background:var(--income);box-shadow:0 0 6px var(--income);}
.tx-dot.expense{background:var(--expense);box-shadow:0 0 6px var(--expense);}
.tx-desc{font-size:0.83rem;}
.tx-meta{font-size:0.6rem;color:var(--muted);margin-top:0.12rem;text-transform:uppercase;letter-spacing:0.08em;}
.tx-amount{font-family:'DM Serif Display',serif;font-size:1rem;}
.tx-amount.income{color:var(--income);}.tx-amount.expense{color:var(--expense);}
.tx-action{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;padding:0.2rem 0.35rem;border-radius:4px;transition:color 0.15s,background 0.15s;}
.tx-action.edit:hover{color:var(--accent);background:rgba(240,192,96,0.1);}
.tx-action.del:hover{color:var(--expense);background:rgba(244,100,95,0.1);}
.empty-state{text-align:center;padding:3rem;color:var(--muted);font-size:0.78rem;letter-spacing:0.08em;}
.empty-state .emoji{font-size:2rem;display:block;margin-bottom:0.75rem;}

/* REPORTS */
.reports-top{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.reports-top label{font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}
.reports-top select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.78rem;padding:0.4rem 0.7rem;outline:none;cursor:pointer;}
.reports-top select:focus{border-color:var(--accent);}

.reports-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.4rem;}
.report-card.full{grid-column:span 2;}
.report-card h3{font-family:'DM Serif Display',serif;font-size:1rem;margin-bottom:1.2rem;}

.month-chart{display:flex;align-items:flex-end;gap:8px;height:110px;}
.month-col{display:flex;flex-direction:column;align-items:center;flex:1;}
.month-bars{display:flex;gap:3px;align-items:flex-end;height:100px;}
.mbar{width:12px;border-radius:4px 4px 0 0;transition:height 0.5s cubic-bezier(0.34,1.56,0.64,1);min-height:2px;cursor:pointer;}
.mbar.inc{background:var(--income);}.mbar.exp{background:var(--expense);}
.month-label{font-size:0.55rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:5px;}
.legend{display:flex;gap:1rem;margin-top:0.75rem;}
.legend-item{display:flex;align-items:center;gap:0.4rem;font-size:0.62rem;color:var(--muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;}

.cat-list{display:flex;flex-direction:column;gap:0.75rem;}
.cat-row{display:flex;flex-direction:column;gap:0.3rem;}
.cat-info{display:flex;justify-content:space-between;align-items:baseline;}
.cat-name{font-size:0.72rem;}.cat-pct{font-size:0.65rem;color:var(--muted);}
.cat-track{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.cat-fill{height:100%;border-radius:99px;transition:width 0.6s ease;}

.stat-row{display:flex;justify-content:space-between;padding:0.65rem 0;border-bottom:1px solid var(--border);align-items:center;}
.stat-row:last-child{border-bottom:none;}
.stat-label{font-size:0.72rem;color:var(--muted);}
.stat-value{font-family:'DM Serif Display',serif;font-size:1.05rem;}

.sub-list{display:flex;flex-direction:column;gap:0.6rem;}
.sub-row{display:flex;justify-content:space-between;align-items:center;padding:0.65rem 0.9rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
.sub-left{display:flex;flex-direction:column;gap:0.15rem;}
.sub-name{font-size:0.8rem;}
.sub-desc{font-size:0.62rem;color:var(--muted);}
.sub-badge{font-size:0.58rem;background:rgba(90,96,117,0.25);color:var(--muted);padding:0.15rem 0.5rem;border-radius:4px;letter-spacing:0.06em;}
.sub-amt{font-size:0.85rem;color:var(--expense);}
.sub-total-row{border-color:var(--accent);background:rgba(240,192,96,0.06);}
.sub-total-amt{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--accent);}

@media(max-width:700px){
  .summary{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr 1fr;}
  .form-grid>*:first-child{grid-column:span 2;}
  .form-grid>.btn-primary{grid-column:span 2;}
  .reports-grid{grid-template-columns:1fr;}
  .report-card.full{grid-column:span 1;}
  .modal-grid{grid-template-columns:1fr;}
  .modal-grid .span2{grid-column:span 1;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Def<span>ter</span></h1>
      <p>Kişisel Muhasebe ve Finans Takibi</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('islemler',this)">📋 İşlemler</button>
      <button class="tab-btn" onclick="switchTab('raporlar',this)">📊 Raporlar</button>
    </div>
  </header>

  <!-- ===== İŞLEMLER ===== -->
  <div id="page-islemler" class="page active">
    <div class="summary">
      <div class="card income"><label>Toplam Gelir</label><div class="amount" id="totalIncome">₺0,00</div><div class="sub" id="incomeCount">0 işlem</div></div>
      <div class="card expense"><label>Toplam Gider</label><div class="amount" id="totalExpense">₺0,00</div><div class="sub" id="expenseCount">0 işlem</div></div>
      <div class="card balance"><label>Net Bakiye</label><div class="amount" id="netBalance">₺0,00</div><div class="sub" id="balanceStatus">—</div></div>
    </div>
    <div class="ratio-bar"><div class="bar-income" id="barIncome" style="width:0%"></div><div class="bar-expense" id="barExpense" style="width:0%"></div></div>

    <div class="form-panel">
      <h2>İşlem Ekle</h2>
      <div class="form-grid">
        <div class="field"><label>Açıklama</label><input type="text" id="desc" placeholder="ör. Maaş, Netflix..."/></div>
        <div class="field"><label>Tutar (₺)</label><input type="number" id="amount" placeholder="0,00" min="0" step="0.01"/></div>
        <div class="field"><label>Tür</label><select id="type" onchange="updateCats('type','category')"><option value="income">Gelir</option><option value="expense">Gider</option></select></div>
        <div class="field"><label>Kategori</label><select id="category"></select></div>
        <div class="field"><label>Tarih</label><input type="date" id="txDate"/></div>
        <div class="field" style="justify-content:flex-end"><button class="btn-primary" onclick="addTransaction()">+ Ekle</button></div>
      </div>
    </div>

    <div class="tx-panel">
      <div class="panel-header">
        <h2>İşlemler</h2>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('all',this)">Tümü</button>
          <button class="filter-btn" onclick="setFilter('income',this)">Gelir</button>
          <button class="filter-btn" onclick="setFilter('expense',this)">Gider</button>
        </div>
      </div>
      <div class="tx-list" id="txList"><div class="empty-state"><span class="emoji">📒</span>Henüz işlem yok. Yukarıdan ekleyin.</div></div>
    </div>
  </div>

  <!-- ===== RAPORLAR ===== -->
  <div id="page-raporlar" class="page">
    <div class="reports-top">
      <label>Dönem:</label>
      <select id="repMonth" onchange="renderReports()"></select>
      <select id="repYear"  onchange="renderReports()"></select>
    </div>

    <div class="reports-grid">
      <div class="report-card full">
        <h3>Son 6 Ay — Gelir / Gider Karşılaştırması</h3>
        <div class="month-chart" id="monthChart"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--income)"></div>Gelir</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--expense)"></div>Gider</div>
        </div>
      </div>

      <div class="report-card">
        <h3>Kategori Dağılımı (Gider)</h3>
        <div class="cat-list" id="catBreakdown"></div>
      </div>

      <div class="report-card">
        <h3>Aylık Özet</h3>
        <div id="monthStats"></div>
      </div>

      <div class="report-card full">
        <h3>Abonelikler &amp; Sabit Giderler</h3>
        <div class="sub-list" id="subList"></div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>✎ İşlemi Düzenle</h3>
    <div class="modal-grid">
      <div class="field span2"><label>Açıklama</label><input type="text" id="eDesc"/></div>
      <div class="field"><label>Tutar (₺)</label><input type="number" id="eAmount" min="0" step="0.01"/></div>
      <div class="field"><label>Tarih</label><input type="date" id="eDate"/></div>
      <div class="field"><label>Tür</label><select id="eType" onchange="updateCats('eType','eCategory')"><option value="income">Gelir</option><option value="expense">Gider</option></select></div>
      <div class="field"><label>Kategori</label><select id="eCategory"></select></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn-primary" onclick="saveEdit()">Kaydet</button>
    </div>
  </div>
</div>

<script>
const CATS = {
  income:  ['Maaş','Serbest Çalışma','Kira Geliri','Yatırım Geliri','Prim / İkramiye','Diğer Gelir'],
  expense: ['Abonelikler','Kira','Market','Fatura','Elektrik','Doğalgaz','Su','Telefon','İnternet',
            'Netflix','Spotify','YouTube Premium','Disney+','Apple TV+','Exxen',
            'Sigorta','Ulaşım','Yakıt','Sağlık','İlaç','Giyim',
            'Yemek / Restoran','Kafe','Eğitim','Spor / Üyelik','Bakım / Güzellik','Diğer']
};
const SUB_CATS = ['Abonelikler','Netflix','Spotify','YouTube Premium','Disney+','Apple TV+','Exxen','İnternet','Telefon','Sigorta','Spor / Üyelik'];
const MONTHS   = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const MONTHS_F = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const COLORS   = ['#f4645f','#f0c060','#2dd4a0','#60a5fa','#c084fc','#fb923c','#34d399','#f472b6'];

let txs = JSON.parse(localStorage.getItem('defter_v2') || '[]');
let activeFilter = 'all';
let editId = null;

const save = () => localStorage.setItem('defter_v2', JSON.stringify(txs));
const fmt  = n => '₺' + Math.abs(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const today= () => new Date().toISOString().split('T')[0];
const fmtD = d => { if(!d) return ''; const [y,m,dy]=d.split('-'); return `${dy} ${MONTHS[+m-1]} ${y}`; };

function updateCats(typeId, catId){
  const type = document.getElementById(typeId).value;
  const sel  = document.getElementById(catId);
  const cur  = sel.value;
  sel.innerHTML = CATS[type].map(c=>`<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
}

// ADD
function addTransaction(){
  const desc   = document.getElementById('desc').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);
  const type   = document.getElementById('type').value;
  const cat    = document.getElementById('category').value;
  const date   = document.getElementById('txDate').value || today();
  if(!desc)  { alert('Lütfen açıklama girin.'); return; }
  if(!amount || amount<=0) { alert('Geçerli bir tutar girin.'); return; }
  txs.unshift({id:Date.now(), desc, amount, type, category:cat, date});
  save(); render();
  document.getElementById('desc').value='';
  document.getElementById('amount').value='';
  document.getElementById('txDate').value='';
}

function deleteTransaction(id){
  if(!confirm('Bu işlemi silmek istediğinizden emin misiniz?')) return;
  txs = txs.filter(t=>t.id!==id);
  save(); render();
}

function openEdit(id){
  const t=txs.find(x=>x.id===id); if(!t) return;
  editId=id;
  document.getElementById('eDesc').value   = t.desc;
  document.getElementById('eAmount').value = t.amount;
  document.getElementById('eType').value   = t.type;
  updateCats('eType','eCategory');
  document.getElementById('eCategory').value = t.category||'';
  document.getElementById('eDate').value   = t.date||today();
  document.getElementById('editModal').classList.add('open');
}
function closeModal(){ document.getElementById('editModal').classList.remove('open'); editId=null; }
function saveEdit(){
  const t=txs.find(x=>x.id===editId); if(!t) return;
  const desc=document.getElementById('eDesc').value.trim();
  const amount=parseFloat(document.getElementById('eAmount').value);
  if(!desc){alert('Açıklama boş olamaz.');return;}
  if(!amount||amount<=0){alert('Geçerli tutar girin.');return;}
  t.desc=desc; t.amount=amount;
  t.type=document.getElementById('eType').value;
  t.category=document.getElementById('eCategory').value;
  t.date=document.getElementById('eDate').value||today();
  save(); render(); closeModal();
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function switchTab(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='raporlar') renderReports();
}

// ---- RENDER ----
function render(){ renderSummary(); renderList(); }

function renderSummary(){
  const inc = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const net = inc-exp; const tot=inc+exp;
  document.getElementById('totalIncome').textContent  = fmt(inc);
  document.getElementById('totalExpense').textContent = fmt(exp);
  document.getElementById('netBalance').textContent   = (net>=0?'':'-')+fmt(net);
  document.getElementById('incomeCount').textContent  = txs.filter(t=>t.type==='income').length+' işlem';
  document.getElementById('expenseCount').textContent = txs.filter(t=>t.type==='expense').length+' işlem';
  document.getElementById('balanceStatus').textContent= net>=0?'▲ fazla':'▼ açık';
  document.getElementById('barIncome').style.width  = tot>0?(inc/tot*100)+'%':'0%';
  document.getElementById('barExpense').style.width = tot>0?(exp/tot*100)+'%':'0%';
}

function renderList(){
  const list=document.getElementById('txList');
  const filtered = activeFilter==='all'?txs:txs.filter(t=>t.type===activeFilter);
  if(!filtered.length){
    list.innerHTML=`<div class="empty-state"><span class="emoji">📒</span>Henüz ${activeFilter==='all'?'':activeFilter==='income'?'gelir ':'gider '}işlemi yok.</div>`;
    return;
  }
  list.innerHTML=filtered.map(t=>`
    <div class="tx-item">
      <div class="tx-dot ${t.type}"></div>
      <div>
        <div class="tx-desc">${t.desc}</div>
        <div class="tx-meta">${t.category||''} · ${fmtD(t.date)}</div>
      </div>
      <div class="tx-amount ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
      <button class="tx-action edit" onclick="openEdit(${t.id})" title="Düzenle">✎</button>
      <button class="tx-action del"  onclick="deleteTransaction(${t.id})" title="Sil">✕</button>
    </div>`).join('');
}

// ---- REPORTS ----
function initRepSelectors(){
  const now=new Date();
  const mSel=document.getElementById('repMonth');
  const ySel=document.getElementById('repYear');
  MONTHS_F.forEach((m,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=m;
    if(i===now.getMonth()) o.selected=true;
    mSel.appendChild(o);
  });
  for(let y=now.getFullYear()-2;y<=now.getFullYear();y++){
    const o=document.createElement('option');
    o.value=y; o.textContent=y;
    if(y===now.getFullYear()) o.selected=true;
    ySel.appendChild(o);
  }
}

function txsOfMonth(m,y){ return txs.filter(t=>{ if(!t.date) return false; const d=new Date(t.date); return d.getMonth()===+m && d.getFullYear()===+y; }); }

function renderReports(){
  const m=document.getElementById('repMonth').value;
  const y=document.getElementById('repYear').value;
  renderMonthChart(+m,+y);
  renderCatBreakdown(+m,+y);
  renderMonthStats(+m,+y);
  renderSubscriptions();
}

function renderMonthChart(curM, curY){
  const months=[];
  for(let i=5;i>=0;i--){ let m=curM-i,y=curY; if(m<0){m+=12;y--;} months.push({m,y}); }
  const maxVal=months.reduce((mx,{m,y})=>{ const t=txsOfMonth(m,y); return Math.max(mx, t.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0), t.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)); },1);
  document.getElementById('monthChart').innerHTML=months.map(({m,y})=>{
    const t=txsOfMonth(m,y);
    const inc=t.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
    const exp=t.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
    const ih=Math.max(2,Math.round(inc/maxVal*96));
    const eh=Math.max(2,Math.round(exp/maxVal*96));
    return `<div class="month-col">
      <div class="month-bars">
        <div class="mbar inc" style="height:${ih}px" title="Gelir: ${fmt(inc)}"></div>
        <div class="mbar exp" style="height:${eh}px" title="Gider: ${fmt(exp)}"></div>
      </div>
      <div class="month-label">${MONTHS[m]}</div>
    </div>`;
  }).join('');
}

function renderCatBreakdown(m,y){
  const data=txsOfMonth(m,y).filter(t=>t.type==='expense');
  const totals={};
  data.forEach(t=>{ const c=t.category||'Diğer'; totals[c]=(totals[c]||0)+t.amount; });
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const grand=sorted.reduce((s,[,v])=>s+v,0)||1;
  const el=document.getElementById('catBreakdown');
  if(!sorted.length){ el.innerHTML='<div style="color:var(--muted);font-size:0.78rem;">Bu dönemde gider kaydı yok.</div>'; return; }
  el.innerHTML=sorted.slice(0,8).map(([cat,amt],i)=>`
    <div class="cat-row">
      <div class="cat-info">
        <span class="cat-name">${cat}</span>
        <span class="cat-pct">${fmt(amt)} · %${(amt/grand*100).toFixed(0)}</span>
      </div>
      <div class="cat-track"><div class="cat-fill" style="width:${(amt/grand*100).toFixed(1)}%;background:${COLORS[i%COLORS.length]}"></div></div>
    </div>`).join('');
}

function renderMonthStats(m,y){
  const data=txsOfMonth(m,y);
  const inc=data.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=data.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const net=inc-exp;
  const expTxs=data.filter(t=>t.type==='expense');
  const avg=expTxs.length?exp/expTxs.length:0;
  const maxTx=expTxs.length?expTxs.reduce((a,b)=>b.amount>a.amount?b:a):null;
  document.getElementById('monthStats').innerHTML=`
    <div class="stat-row"><span class="stat-label">Toplam Gelir</span><span class="stat-value" style="color:var(--income)">${fmt(inc)}</span></div>
    <div class="stat-row"><span class="stat-label">Toplam Gider</span><span class="stat-value" style="color:var(--expense)">${fmt(exp)}</span></div>
    <div class="stat-row"><span class="stat-label">Net Bakiye</span><span class="stat-value" style="color:var(--accent)">${net>=0?'+':''}${fmt(net)}</span></div>
    <div class="stat-row"><span class="stat-label">Ort. Gider</span><span class="stat-value">${fmt(avg)}</span></div>
    <div class="stat-row"><span class="stat-label">En Büyük Gider</span><span class="stat-value" style="font-size:0.82rem">${maxTx?maxTx.desc+' ('+fmt(maxTx.amount)+')':'—'}</span></div>
    <div class="stat-row"><span class="stat-label">Toplam İşlem</span><span class="stat-value">${data.length}</span></div>`;
}

function renderSubscriptions(){
  const seen={};
  txs.filter(t=>t.type==='expense' && SUB_CATS.includes(t.category))
     .forEach(t=>{ if(!seen[t.category]||t.date>seen[t.category].date) seen[t.category]=t; });
  const subs=Object.values(seen);
  const el=document.getElementById('subList');
  if(!subs.length){
    el.innerHTML='<div style="color:var(--muted);font-size:0.78rem;padding:0.5rem 0">Henüz abonelik/sabit gider kaydı yok.<br><span style="opacity:0.6">"Abonelikler" kategorisi veya Netflix, Spotify, Telefon vb. seçince burada görünür.</span></div>';
    return;
  }
  const total=subs.reduce((s,t)=>s+t.amount,0);
  el.innerHTML=subs.sort((a,b)=>b.amount-a.amount).map(t=>`
    <div class="sub-row">
      <div class="sub-left"><span class="sub-name">${t.category}</span><span class="sub-desc">${t.desc}</span></div>
      <span class="sub-badge">Aylık</span>
      <span class="sub-amt">${fmt(t.amount)}/ay</span>
    </div>`).join('')
  +`<div class="sub-row sub-total-row">
      <div class="sub-left"><span class="sub-name" style="color:var(--accent)">Toplam Sabit Gider</span></div>
      <span></span>
      <span class="sub-total-amt">${fmt(total)}/ay</span>
    </div>`;
}

// ---- INIT ----
document.getElementById('txDate').value = today();
updateCats('type','category');
initRepSelectors();
render();

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && ['desc','amount'].includes(document.activeElement.id)) addTransaction();
  if(e.key==='Escape') closeModal();
});
</script>
